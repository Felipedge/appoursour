spring.application.name=ms-catalogo
server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/db_catalogo?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Crea las tablas (schema.sql) y carga datos de prueba (data.sql) en cada arranque
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-larga-de-al-menos-32-caracteres}
servicios.clave-interna=${INTERNAL_KEY:cambia-esta-clave-interna-de-al-menos-32-caracteres}
