spring.application.name=ms_pago
server.port=8086
spring.datasource.url=jdbc:mysql://localhost:3306/db_pago?serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Cambia el puerto por el que use tu ms_pedido
servicios.pedido.url=http://localhost:8085

# JWT emitido por ms-usuarios: la clave debe ser idéntica en todos los servicios
jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-larga-de-al-menos-32-caracteres}
servicios.clave-interna=${INTERNAL_KEY:cambia-esta-clave-interna-de-al-menos-32-caracteres}
