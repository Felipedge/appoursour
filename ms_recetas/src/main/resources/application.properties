spring.application.name=ms_recetas
server.port=8084
spring.datasource.url=jdbc:mysql://localhost:3306/db_recetas?serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

servicios.metricas.url=http://localhost:8083
