spring.application.name=ms_recetas
server.port=8084
spring.datasource.url=jdbc:mysql://localhost:3306/db_recetas?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Crea las tablas (schema.sql) y carga datos de prueba (data.sql) en cada arranque
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
jwt.secret=${JWT_SECRET:clave_secreta_super_segura_desarrollo_2026}
jwt.expiration-ms=86400000


