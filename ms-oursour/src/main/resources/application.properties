spring.application.name=ms-usuarios
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/db_usuarios?serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-larga-de-al-menos-32-caracteres}
jwt.expiration-ms=86400000