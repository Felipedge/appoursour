spring.application.name=ms-metricas
server.port=8083
spring.datasource.url=jdbc:mysql://localhost:3306/db_metricas?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Crea las tablas (schema.sql) y carga datos de prueba (data.sql) en cada arranque
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

servicios.recetas.url=http://localhost:8084
servicios.catalogo.url=http://localhost:8082
servicios.pedido.url=http://localhost:8085

# JWT emitido por ms-usuarios: la clave debe ser idéntica en todos los servicios
jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-larga-de-al-menos-32-caracteres}

# Clave que se envían los microservicios entre sí en /internal/** (header X-Internal-Key).
# Debe ser idéntica en los 5 servicios; la app nunca la conoce.
servicios.clave-interna=${INTERNAL_KEY:cambia-esta-clave-interna-de-al-menos-32-caracteres}
