spring.application.name=ms-metricas
server.port=8086
spring.datasource.url=jdbc:mysql://localhost:3306/db_metricas?serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

servicios.recetas.url=http://localhost:8083
servicios.catalogo.url=http://localhost:8082
servicios.pedido.url=http://localhost:8084
